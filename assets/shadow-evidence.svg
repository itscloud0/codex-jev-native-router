<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Effortlane Shadow proposal evidence</title>
<desc id="desc">A 360-decision Shadow observation from 2026-09-29 through 2026-10-02. Of 312 Jev-backed proposals, Sol was proposed 286 times and Luna 26 times. Proposed effort was lower 114 times, the same 163 times, and higher 35 times than actual selection. Alternatives were not executed, so savings and quality are not demonstrated.</desc>
