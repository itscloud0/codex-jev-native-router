<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="415" viewBox="0 0 1200 415" role="img" aria-labelledby="title desc"><title id="title">Effortlane architecture</title><desc id="desc">Bounded task signal to Jev to local policy to native executor. Auto applies decisions; Shadow records them.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172b36"/></linearGradient><linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#a3e635"/></linearGradient></defs><rect width="1200" height="415" rx="22" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="44" y="52" fill="#ffffff" font-size="30" font-weight="600">One small decision. Full native execution.</text><text x="44" y="86" fill="#94a3b8" font-size="19" font-weight="400">Routing state is bounded. Executor context stays with Codex.</text><rect x="44" y="130" width="220" height="164" rx="15" fill="#142536" stroke="#2e4758"/><text x="64" y="165" fill="#5eead4" font-size="17" font-weight="600">01</text><text x="64" y="205" fill="#ffffff" font-size="24" font-weight="600">Task signal</text><text x="64" y="241" fill="#b6c4d6" font-size="17" font-weight="400">Sanitized excerpt</text><text x="64" y="268" fill="#b6c4d6" font-size="17" font-weight="400">Context / cache hints</text><path d="M272 212h28m-8-7 8 7-8 7" stroke="#5eead4" fill="none" stroke-width="2"/><rect x="310" y="130" width="235" height="164" rx="15" fill="#142536" stroke="#2e4758"/><text x="330" y="165" fill="#5eead4" font-size="17" font-weight="600">02</text><text x="330" y="205" fill="#ffffff" font-size="24" font-weight="600">Jev decision</text><text x="330" y="241" fill="#b6c4d6" font-size="17" font-weight="400">Work shape</text><text x="330" y="268" fill="#b6c4d6" font-size="17" font-weight="400">Reasoning effort</text><path d="M553 212h28m-8-7 8 7-8 7" stroke="#5eead4" fill="none" stroke-width="2"/><rect x="591" y="130" width="240" height="164" rx="15" fill="#142536" stroke="#2e4758"/><text x="611" y="165" fill="#5eead4" font-size="17" font-weight="600">03</text><text x="611" y="205" fill="#ffffff" font-size="24" font-weight="600">Local policy</text><text x="611" y="241" fill="#b6c4d6" font-size="17" font-weight="400">Overrides + allowlist</text><text x="611" y="268" fill="#b6c4d6" font-size="17" font-weight="400">Risk + continuity</text><path d="M839 212h28m-8-7 8 7-8 7" stroke="#5eead4" fill="none" stroke-width="2"/><rect x="877" y="130" width="279" height="164" rx="15" fill="#142536" stroke="#2e4758"/><text x="897" y="165" fill="#5eead4" font-size="17" font-weight="600">04</text><text x="897" y="205" fill="#ffffff" font-size="24" font-weight="600">Native executor</text><text x="897" y="241" fill="#b6c4d6" font-size="17" font-weight="400">Your authenticated model</text><text x="897" y="268" fill="#b6c4d6" font-size="17" font-weight="400">Full canonical context</text><text x="44" y="346" fill="#5eead4" font-size="15" font-weight="700">AUTO</text><text x="118" y="346" fill="#cbd5e1" font-size="19" font-weight="400">Apply a validated route between turns.</text><text x="44" y="379" fill="#a3e635" font-size="15" font-weight="700">SHADOW</text><text x="118" y="379" fill="#cbd5e1" font-size="19" font-weight="400">Keep Sol + your effort. Record independent proposals.</text></g></svg>